name: Build container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bjn/seestar-alp-homelab
  UPSTREAM_SHA: b007037d346714cd805775ded6f3402d2c0a5194

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out wrapper
        uses: actions/checkout@v4

      - name: Check out pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: smart-underworld/seestar_alp
          ref: ${{ env.UPSTREAM_SHA }}
          path: source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=upstream-${{ env.UPSTREAM_SHA }}

      - name: Record digest
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
